name: test
# Merge-gated and manual, ONE job. GitHub bills each job rounded UP to a full minute,
# so splitting this would cost more than it saves. Working branches are verified
# locally; CI is the gate at integration.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hard ceiling. Timeouts inside the suite are deliberately generous — a runner is
    # ~10x slower to boot the Simulator than a dev machine — but generous timeouts turn
    # a hang into a 6-hour job at the default limit. Bound it here so a stuck run costs
    # minutes, not a billing incident.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # xvfb gives the Simulator a display; openbox gives it a FOCUS MODEL, without
      # which SDL reads no keyboard and every injected press vanishes silently;
      # xdotool does the injecting; imagemagick's `import` takes window screenshots.
      #
      # libwebkit2gtk is the one that is easy to miss: the Simulator links it, and
      # without it the process starts, prints NOTHING, maps no window, and never
      # exits — so every test fails with an empty console and "no window", which
      # looks like the Simulator not working headlessly at all rather than a missing
      # runtime library. The first CI run failed exactly that way.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xdotool imagemagick libwebkit2gtk-4.1-0

      - name: Download the Playdate SDK
        run: |
          set -eux
          curl -fSL -o sdk.tar.gz \
            https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-latest.tar.gz
          mkdir sdk && tar -xzf sdk.tar.gz -C sdk
          PDC="$(find "$PWD/sdk" -type f -name pdc | head -1)"
          echo "PLAYDATE_SDK_PATH=$(dirname "$(dirname "$PDC")")" >> "$GITHUB_ENV"
          echo "$(dirname "$PDC")" >> "$GITHUB_PATH"

      - run: pip3 install -e ".[dev]"

      # Fail here, loudly, rather than in seven test teardowns. If the Simulator cannot
      # start at all, every SDK test reports "no window" or an empty console, and none
      # of them says why.
      - name: The Simulator starts at all
        run: |
          set -eux
          SDL_AUDIODRIVER=dummy timeout 60 xvfb-run -a \
            "$PLAYDATE_SDK_PATH/bin/PlaydateSimulator" --help

      # The SDK suite is the one that matters. Everything this package claims — that a
      # Simulator runs headless, that keys arrive, that a Lua error is detectable
      # without a device — is only true if these pass, so they are not optional here
      # even though they are deselected by default locally.
      - name: The Simulator runs headless, and answers
        env:
          # Without this the job shows NOTHING for its entire duration: pytest's output
          # is block-buffered when stdout is a pipe, which on Actions it always is. The
          # same buffering rule that hides the Simulator's console hides the test
          # runner's, and a silent 15-minute step is indistinguishable from a hung one.
          PYTHONUNBUFFERED: "1"
        # -v so each test reports as it finishes rather than as a dot at the end, and
        # --durations so the slowest are named -- this suite is dominated by Simulator
        # startup and it is worth seeing where.
        run: python3 -u -m pytest -v --durations=10 -m "sdk or not sdk"
